<div class="main">


	<div id="images-categories">

			<div class="images-categories-title">{{imagesCategoriesCatTitle}}</div>
			<div class="row">
				<div class="col category-title">
					Category1
				</div>
				<div class="col category-title">
					Category2
				</div>
				<div class="col category-title">
					Category3
				</div>
			</div>
			<div class="row">
				<div class="col category" id="category1">

				<div class="col category" id="category2">

				<div class="col category" id="category3">

		</div>
	</div>

	<hr />
</div>
