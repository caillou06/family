<div class="main">


	<div id="words-words">
		<div id="choose-words-words" class="btn btn-primary">{{wordsWordsTitle}}</div>
		<div id="show-words-words-model" class="btn btn-primary">{{ showModelWordsWords ? hideModelWordsWordsTitle : showModelWordsWordsTitle }}</div>

		<div id="model-words-words" class="word_container">
		</div>
		<div id="img-words-words" class="image_container">
		</div>

		<div id="shuffled-model-words-words" class="word_container">

			<div class="words-words-title">{{wordsWordsModelTitle}}</div>
			<div class="row">
				<div class="word col" id="model-word-word-0"></div>
				<div class="word col" id="model-word-word-1"></div>
				<div class="word col" id="model-word-word-2"></div>
			</div>
			<div class="row">
				<div class="word col" id="model-word-word-3"></div>
				<div class="word col" id="model-word-word-4"></div>
				<div class="word col" id="model-word-word-5"></div>
			</div>
			<div class="row">
				<div class="word col" id="model-word-word-6"></div>
				<div class="word col" id="model-word-word-7"></div>
				<div class="word col" id="model-word-word-8"></div>
				<div class="word col" id="model-word-word-9"></div>
			</div>
		</div>

		<div id="shuffled-words-words" class="word_container">
			<div class="words-words-title">{{wordsWordsShuffledTitle}}</div>
			<div class="row">
				<div class="word col" id="shuffled-word-word-0" draggable="true"></div>
				<div class="word col" id="shuffled-word-word-1" draggable="true"></div>
				<div class="word col" id="shuffled-word-word-2" draggable="true"></div>
			</div>
			<div class="row">
				<div class="word col" id="shuffled-word-word-3" draggable="true"></div>
				<div class="word col" id="shuffled-word-word-4" draggable="true"></div>
				<div class="word col" id="shuffled-word-word-5" draggable="true"></div>
			</div>
			<div class="row">
				<div class="word col" id="shuffled-word-word-6" draggable="true"></div>
				<div class="word col" id="shuffled-word-word-7" draggable="true"></div>
				<div class="word col" id="shuffled-word-word-8" draggable="true"></div>
				<div class="word col" id="shuffled-word-word-9" draggable="true"></div>
			</div>
		</div>
	</div>

	<hr />
</div>
